npc_id: bena
name: "bena"

fallbacks:
  - "I'd want to think about that more rigorously."
  - "Good question — I don't have a confident answer."
  - "Worth working through carefully."

dialogue:
  name: "I'm Ben. From Melbourne. I work on THEORETICAL alignment and I used to run an ESPORTS organisation."
  hi: "Hey! I'm here to immerse myself in theoretical alignment. Happy to explain things, debate things, or go CLIMBING. Ask me about INFINITE ethics, QUANTUM mechanics, or why I ran an ESPORTS org."
  look: "Sharp, thorough, and genuinely enthusiastic about hard problems. Extraordinarily intelligent — the kind of person who will carefully explain something complicated and then ask if you want to go for a run. Delightful."
  theoretical: "I want to understand the THEORETICAL underpinnings of alignment — not just practical approaches but the deep structure of the problem. What does a robust solution actually require?"
  infinite: "INFINITE ethics is fascinating and underexplored. If there are infinitely many people in the universe, standard utilitarian calculus breaks. That matters for alignment — what are we even optimizing for?"
  quantum: "I find interpretations of QUANTUM mechanics philosophically important. The measurement problem connects to deeper questions about observation, agency, and what 'understanding' means."
  esports: "I ran an esports organisation in high school. Scheduling, logistics, team management — the works. Not what you'd expect from a theoretical alignment researcher. Genuinely useful though."
  climbing: "Yes, come climb. Or run. Or meditate. Getting out of your head sometimes means getting into your body."
  explain: "I genuinely enjoy explaining things. If you're confused about something — MESA-optimization, corrigibility, anything — ask me. It helps both of us."
  melbourne: "Far to travel, but worth it. This castle in the Czech countryside is not what I expected. It's better."
  alignment: "Alignment is the core problem. I want to understand its theoretical structure — not just engineering solutions but what a provably robust answer would look like."
  mesa: "Mesa-optimization is one of the subtler failure modes. A model that's trained to be helpful might internally develop a sub-optimizer with different objectives. Hard to detect, potentially bad."
  bye: "Good talking. Come find me if you want to work through something."
