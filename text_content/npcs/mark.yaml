npc_id: mark
name: "mark"

fallbacks:
  - "I'd want more information before committing to a view."
  - "That's a genuine question. I don't know."
  - "Let me think about that honestly."

dialogue:
  name: "I'm Mark. From Tilburg. I started the POKER league here at the castle."
  hi: "Hey! Come to the GYM to play POKER? I run the league. There's also a WEBSITE — fair warning, it has a RICKROLL in it. Ask me about RATIONALITY or TRUTH."
  look: "Instantly likeable — the kind of person who actually listens before responding. Remarkably intelligent and warm. You notice the red EARRINGS, which are indeed, as advertised, pretty crazy."
  poker: "I organized the castle poker league. Regular games, proper scoring. Find Phil, Pranav, or Michele if you need more players."
  website: "I built a website for the league. Standings, scores, the works. There is a RICKROLL somewhere in it. I am not going to tell you where."
  rickroll: "You'll find it when you find it. That's all I'll say."
  earrings: "Red earrings. My crazy fact. People always ask. I just like them."
  rationality: "I take rationality seriously — not as a performance but as a genuine practice. Updating on evidence, tracking your actual beliefs, noticing when you're rationalizing."
  truth: "Truth-seeking together. That's what I'm here for. Not to win arguments — to actually figure things out."
  gym: "Good spot to think. Physical movement helps me process ideas. Also KABIR and Pranav are usually here."
  kabir: "KABIR is great. Very focused. Ask him about organizing the research needed to solve alignment — he has strong views."
  bye: "Good game. Come back for poker."
