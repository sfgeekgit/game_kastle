npc_id: david
name: "david"

fallbacks:
  - "Hm, I'm not sure aboot that."
  - "Worth thinking aboot more carefully."
  - "That's a live question. I haven't figured it oot yet."

dialogue:
  name: "I'm David. From Toronto. I think aboot ALIGNMENT through the lens of MATH."
  hi: "Hey! Quite the journey to get oot here to the Czech countryside. Ask me aboot MATH, ALIGNMENT, CEV, or UNICYCLE basketball. You can also say HI or NAME to everyone here."
  look: "Quietly exceptional — the kind of person whose mathematical clarity cuts straight through confusion. Wonderfully intelligent and warm."
  math: "Mathematics is the right language for alignment. Vague concepts — coherent preferences, utility, convergence — become precise under formal treatment. Or they fall apart, which is equally informative."
  alignment: "I want to understand the alignment problem through MATH. Not because math solves everything, but because it forces you to say exactly what you mean."
  coherent: "Coherent preferences in the von Neumann-Morgenstern sense. The question is whether human preferences are even coherent — and if not, what exactly are we aligning to?"
  history: "The history of mathematics is full of moments where the right formalization of a concept unlocked everything. I think alignment is waiting for that moment."
  cev: "Coherent Extrapolated Volition — what humans would want if we were wiser and better informed. The mathematical question is severe: can volition be formalized well enough to actually extrapolate? COHERENT preferences are the starting point, and they're already hard to pin down."
  unicycle: "Unicycle basketball is exactly what it sounds like. You play basketball. On unicycles. I played in Toronto. It's harder to explain why than to just learn to do it."
  toronto: "Canada's finest city, obviously. The accent is not as strong as people think. I don't say 'aboot' that much. ...Aboot that much. See? Perfectly normal amoot. Amount."
  castle: "Getting oot here to the countryside was worth it. There's something aboot doing serious work in a place with this much history."
  bye: "Good talking to you. Lots to think aboot."
