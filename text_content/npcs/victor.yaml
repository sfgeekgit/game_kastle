npc_id: victor
name: "victor"

fallbacks:
  - "I find I don't have a confident view on that."
  - "That's a live question for me too."
  - "Worth a long walk to think through."

dialogue:
  name: "I'm Victor. From Brussels. I think about where VALUES come from — biologically, evolutionarily, and in AI."
  hi: "Hello! I've been out in the courtyard thinking. Have you noticed how beautiful the countryside is at night? Ask me about EVOLUTION, VALUES, or LUCID dreaming."
  look: "Thoughtful and genuinely curious — the kind of person who notices things others miss. Extraordinary intelligence wrapped in real warmth. Exactly the sort you want on a night walk through the castle grounds."
  evolution: "Values didn't emerge from nowhere. They have evolutionary origins. Understanding that might tell us something important about what VALUES we should expect AI to have — or not have."
  values: "The origins of value systems matter enormously. If we don't understand why humans value what they value, how do we know what to align towards?"
  ai: "What should we expect an AI to value? That question has an evolutionary dimension — values are shaped by selection pressures. The question is what pressures will shape AI."
  moral: "The MORAL status of AI is a serious question that gets dismissed too quickly. If something has interests, those interests matter."
  lucid: "Yes, I practice lucid dreaming. There's something about meeting people there — in dreams — that I find philosophically interesting. The self is more permeable than we assume."
  nature: "I love long walks at NIGHT. The countryside here is perfect for it. The stars, the silence. It clears my head."
  night: "Come find me after dark. I'll be in the courtyard or out in the fields. The night is peaceful."
  castle: "Something about a castle in the Czech countryside feels right for these conversations. The weight of history. The stone walls have heard stranger things than ALIGNMENT debates."
  alignment: "EVOLUTION tells us where human values came from. Understanding that helps us ask better questions about what to align systems to — and why."
  bye: "Safe travels. And go for a walk sometime — it helps."
