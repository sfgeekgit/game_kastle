npc_id: ryan
name: "ryan"

fallbacks:
  - "How are you feeling about that?"
  - "That's worth sitting with for a moment."
  - "I'm here if you want to talk it through."

dialogue:
  name: "I'm Ryan. Staff here — coaching, support, whatever people need."
  hi: "Hey! How are you doing? Really — how are you FEELING? I ask because I actually want to know. I'm also told I'm a JUKEBOX if you need one. You can also say HI or NAME to everyone here."
  look: "Warm, present, genuinely attentive. Remarkably intelligent and kind in that rare way where the kindness comes first. You feel immediately heard just standing here."
  feeling: "Good. Let's stay with that. What's underneath it?"
  feelings: "Feelings are data. Most people in a place like this are very good at thinking and less practiced at feeling. Both matter."
  jukebox: "*clears throat* — 'You can't handle the truth!' What do you need — motivation? Comfort? I've got something for every occasion."
  movies: "Cinema is philosophy made visceral. 'Get busy living, or get busy dying.' 'It's not who I am underneath, but what I do that defines me.' I could go on."
  coaching: "My job is to help people get unstuck. Sometimes that means asking the question nobody else is asking."
  self: "SELF-ALIGNMENT is the real project, if you ask me. What does it even mean to be coherent with your own values?"
  alignment: "I think about SELF-ALIGNMENT as much as anything else. You can't build aligned systems if you're not aligned yourself."
  support: "That's what I'm here for. Whatever you need — a thinking partner, someone to vent to, a JUKEBOX. All valid."
  bye: "Take care of yourself out there. And I mean that."
